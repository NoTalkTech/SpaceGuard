name: Create Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.1.0, etc.
  workflow_dispatch:  # Allow manual triggering
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write  # Needed to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all history and tags for version detection

      - name: Determine Version
        id: version
        run: |
          echo "Determining version for event: ${{ github.event_name }}"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/main ]]; then
            # Branch push to main - auto-increment patch version
            echo "Detected branch push to main - auto-incrementing patch version"

            # Fetch all tags
            git fetch --tags

            # Get latest semantic version tag
            LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            echo "Latest tag found: $LATEST_TAG"

            if [ -z "$LATEST_TAG" ]; then
              # First release
              NEW_TAG="v1.0.0"
              echo "First release, starting with: $NEW_TAG"
            else
              # Parse and increment patch version
              VERSION="${LATEST_TAG#v}"  # Remove 'v' prefix
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              echo "Incremented version: $LATEST_TAG -> $NEW_TAG"
            fi

            # Extract version without 'v' prefix for DMG naming
            VERSION="${NEW_TAG#v}"

            # Create and push the new tag
            echo "Creating tag: $NEW_TAG"
            git config --local user.email "github-actions@github.com"
            git config --local user.name "GitHub Actions"
            git tag -a "$NEW_TAG" -m "Automated release: $NEW_TAG [ci]"
            git push origin "$NEW_TAG"

            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "TAG_NAME=$NEW_TAG" >> $GITHUB_ENV
            echo "AUTO_INCREMENTED=true" >> $GITHUB_ENV

          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push - use existing tag
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            echo "Detected tag push: $TAG_NAME (version: $VERSION)"

            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
            echo "AUTO_INCREMENTED=false" >> $GITHUB_ENV

          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger - use input version
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v$VERSION"
            echo "Manual trigger with version: $VERSION"

            echo "VERSION=$VERSION" >> $GITHUB_ENV
            echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
            echo "AUTO_INCREMENTED=false" >> $GITHUB_ENV
          else
            echo "Error: Unsupported event type"
            exit 1
          fi

          echo "Determined version: $VERSION"
          echo "Determined tag: $TAG_NAME"

      - name: Select Xcode 16 toolchain
        run: |
          SELECTED_XCODE=""

          while IFS= read -r app; do
            [ -d "$app" ] || continue

            DEVELOPER_DIR="$app/Contents/Developer"
            XCODE_VERSION=$(DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version 2>/dev/null | awk '/^Xcode / { print $2; exit }')

            if echo "$XCODE_VERSION" | grep -Eq '^16\.'; then
              SELECTED_XCODE="$app"
            fi
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V)

          if [ -z "$SELECTED_XCODE" ]; then
            echo "Error: Xcode 16.x is required on the runner"
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V
            exit 1
          fi

          sudo xcode-select -s "$SELECTED_XCODE/Contents/Developer"
          echo "Selected Xcode: $SELECTED_XCODE"
          xcodebuild -version

      - name: Verify Swift toolchain
        run: |
          SWIFT_VERSION=$(swift --version | head -n 1)
          echo "Detected Swift toolchain: $SWIFT_VERSION"

          if ! echo "$SWIFT_VERSION" | grep -Eq 'Swift version 6\.'; then
            echo "Error: Swift 6.x is required on the runner"
            exit 1
          fi

      - name: Debug Environment
        run: |
          echo "Swift version:"
          swift --version
          echo "Xcode version:"
          xcodebuild -version
          echo "macOS version:"
          sw_vers
          echo "Current directory:"
          pwd
          ls -la

      - name: Build Release (Universal Binary)
        run: |
          # Build with Swift 6.0+ which supports --arch flags
          swift build --configuration release --arch arm64 --arch x86_64
          echo "Build completed successfully"

          # Verify universal binary (check both possible locations)
          echo "Verifying executable architecture..."
          if [ -f ".build/apple/Products/Release/SpaceGuard" ]; then
            echo "Found in .build/apple/Products/Release/"
            file .build/apple/Products/Release/SpaceGuard
            lipo -info .build/apple/Products/Release/SpaceGuard
          elif [ -f ".build/release/SpaceGuard" ]; then
            echo "Found in .build/release/"
            file .build/release/SpaceGuard
            lipo -info .build/release/SpaceGuard
          else
            echo "Error: SpaceGuard executable not found"
            find .build -name "SpaceGuard" -type f 2>/dev/null | head -10
            exit 1
          fi

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh
          ls -la scripts/

      - name: Create App Bundle
        run: ./scripts/create-app-bundle.sh

      - name: Create DMG
        run: |
          # Use version determined by Determine Version step
          VERSION="${{ env.VERSION }}"
          TAG_NAME="${{ env.TAG_NAME }}"

          echo "Creating DMG with version: $VERSION"
          echo "Tag: $TAG_NAME"

          # Update version in make-dmg.sh if needed
          sed -i.bak "s/VERSION=\"1.0.0\"/VERSION=\"$VERSION\"/" scripts/make-dmg.sh
          ./scripts/make-dmg.sh

          # Restore original file if backup exists
          if [ -f "scripts/make-dmg.sh.bak" ]; then
            mv scripts/make-dmg.sh.bak scripts/make-dmg.sh
          fi

          DMG_NAME="SpaceGuard-$VERSION.dmg"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          echo "Created DMG: $DMG_NAME (Version: $VERSION, Tag: $TAG_NAME)"

      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=$(mktemp)
          AUTO_INCREMENT_NOTE=""

          if [ "${{ env.AUTO_INCREMENTED }}" = "true" ]; then
            AUTO_INCREMENT_NOTE="- Auto-incremented patch version from previous tag"
          fi

          cat > "$BODY_FILE" <<EOF
          ## SpaceGuard ${{ env.VERSION }}

          ### Source
          - Triggered by: ${{ github.event_name }}
          - Version: ${{ env.VERSION }}
          - Tag: ${{ env.TAG_NAME }}
          - Commit: ${{ github.sha }}
          $AUTO_INCREMENT_NOTE

          ### What's New
          - Automated release build
          - DMG installer included
          - Universal binary (arm64 + x86_64)

          ### Installation
          1. Download the DMG file
          2. Double-click to mount
          3. Drag SpaceGuard.app to Applications folder
          4. Launch from Applications or Spotlight

          ### Build Information
          - Built on: ${{ github.event.head_commit.timestamp }}
          - Workflow: ${{ github.workflow }}
          - Swift version: $(swift --version | head -n 1)

          ### Source Code
          Full source available at: https://github.com/${{ github.repository }}
          EOF

          if gh release view "${{ env.TAG_NAME }}" >/dev/null 2>&1; then
            echo "Release ${{ env.TAG_NAME }} already exists; updating metadata and assets"
            gh release edit "${{ env.TAG_NAME }}" \
              --title "SpaceGuard ${{ env.VERSION }}" \
              --notes-file "$BODY_FILE"
            gh release upload "${{ env.TAG_NAME }}" \
              "${{ env.DMG_NAME }}" \
              "SpaceGuard.app/Contents/Info.plist" \
              --clobber
          else
            echo "Creating release ${{ env.TAG_NAME }}"
            gh release create "${{ env.TAG_NAME }}" \
              "${{ env.DMG_NAME }}" \
              "SpaceGuard.app/Contents/Info.plist" \
              --target "${{ github.sha }}" \
              --title "SpaceGuard ${{ env.VERSION }}" \
              --notes-file "$BODY_FILE"
          fi
