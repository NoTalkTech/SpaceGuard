name: Create Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.1.0, etc.
  workflow_dispatch:  # Allow manual triggering
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-and-release:
    runs-on: macos-14
    permissions:
      contents: write  # Needed to create releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'

      - name: Debug Environment
        run: |
          echo "Swift version:"
          swift --version
          echo "Xcode version:"
          xcodebuild -version
          echo "macOS version:"
          sw_vers
          echo "Current directory:"
          pwd
          ls -la

      - name: Build Release (Universal Binary)
        run: |
          # Build with Swift 6.0+ which supports --arch flags
          swift build --configuration release --arch arm64 --arch x86_64
          echo "Build completed successfully"

          # Verify universal binary (check both possible locations)
          echo "Verifying executable architecture..."
          if [ -f ".build/apple/Products/Release/SpaceGuard" ]; then
            echo "Found in .build/apple/Products/Release/"
            file .build/apple/Products/Release/SpaceGuard
            lipo -info .build/apple/Products/Release/SpaceGuard
          elif [ -f ".build/release/SpaceGuard" ]; then
            echo "Found in .build/release/"
            file .build/release/SpaceGuard
            lipo -info .build/release/SpaceGuard
          else
            echo "Error: SpaceGuard executable not found"
            find .build -name "SpaceGuard" -type f 2>/dev/null | head -10
            exit 1
          fi

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh
          ls -la scripts/

      - name: Create App Bundle
        run: ./scripts/create-app-bundle.sh

      - name: Create DMG
        run: |
          # Determine version from tag, input, or commit SHA
          if [[ -n "${{ github.ref }}" && "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push: extract version from tag name (remove 'v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual trigger: use input version
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v$VERSION"
          else
            # Branch push: use commit SHA for version and tag
            SHORT_SHA="${GITHUB_SHA:0:7}"
            VERSION="dev-$SHORT_SHA"
            TAG_NAME="dev-$SHORT_SHA"
          fi

          # Update version in make-dmg.sh if needed
          sed -i.bak "s/VERSION=\"1.0.0\"/VERSION=\"$VERSION\"/" scripts/make-dmg.sh
          ./scripts/make-dmg.sh

          # Restore original file if backup exists
          if [ -f "scripts/make-dmg.sh.bak" ]; then
            mv scripts/make-dmg.sh.bak scripts/make-dmg.sh
          fi

          DMG_NAME="SpaceGuard-$VERSION.dmg"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Created DMG: $DMG_NAME (Version: $VERSION, Tag: $TAG_NAME)"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: SpaceGuard ${{ env.VERSION }}
          body: |
            ## SpaceGuard ${{ env.VERSION }}

            ### Source
            - Triggered by: ${{ github.event_name }}
            - ${{ github.event_name == 'push' && 'Branch' || 'Tag' }}: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}

            ### What's New
            - Automated release build
            - DMG installer included
            - Universal binary (arm64 + x86_64)

            ### Installation
            1. Download the DMG file
            2. Double-click to mount
            3. Drag SpaceGuard.app to Applications folder
            4. Launch from Applications or Spotlight

            ### Build Information
            - Built on: ${{ github.event.head_commit.timestamp }}
            - Workflow: ${{ github.workflow }}
            - Swift version: 6.0

            ### Source Code
            Full source available at: https://github.com/${{ github.repository }}
          draft: false
          prerelease: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
          generate_release_notes: false
          make_latest: false
          files: |
            ${{ env.DMG_NAME }}
            SpaceGuard.app/Contents/Info.plist

      - name: Upload DMG to Release
        if: steps.create_release.outputs.id != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./${{ env.DMG_NAME }}
          asset_name: ${{ env.DMG_NAME }}
          asset_content_type: application/octet-stream